<script>
    // Task 0. First Script
    console.log("Student: Ибрай Муратбек");
    console.log("Group: SE-2529");
    alert("Hello, JavaScript World!");

    // Task 1. Variables & Operators
    let studentName = "Ибрай";
    let studentAge = 18;
    let isEnrolled = true;

    console.log("--- Variables & Operators ---");
    console.log("Name:", studentName, "(Type:", typeof studentName, ")");
    console.log("Age:", studentAge, "(Type:", typeof studentAge, ")");
    console.log("Enrolled:", isEnrolled, "(Type:", typeof isEnrolled, ")");
    let a = 10;
    let b = 5;
    console.log("Arithmetic operations (a = 10, b = 5):");
    console.log("Addition (a + b) =", a + b);
    console.log("Subtraction (a - b) =", a - b);
    console.log("Multiplication (a * b) =", a * b);
    console.log("Division (a / b) =", a / b);
    let greeting = "Hello, " + studentName + "! Welcome to Astana IT University.";
    console.log("String Concatenation:", greeting);
</script>
